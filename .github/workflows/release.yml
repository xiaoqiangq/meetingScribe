name: Publish release candidate
on:
  push:
    branches: [main]
    paths: ['VERSION']
permissions:
  contents: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: npm ci
        working-directory: web/frontend
      - run: bash scripts/verify.sh
      - run: docker compose config --quiet
      - run: docker build --tag huiji-p:release-check --file Dockerfile.cuda .
      - name: Package application
        shell: bash
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          mkdir -p release/huiji-p/web/frontend/src/assets
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$version -X main.commit=$GITHUB_SHA -X main.date=$(date -u +%FT%TZ)" -o release/huiji-p/huiji-p ./cmd/server
          cp .env.example VERSION README.md README.en.md README.zh-CN.md LICENSE CHANGELOG.md CHANGELOG.zh-CN.md release/huiji-p/
          cp web/frontend/src/assets/meeting-assistant-waveform.jpg release/huiji-p/web/frontend/src/assets/
          cp -R docs runtime scripts deploy release/huiji-p/
          python - <<'PYINFO'
          import json, os, pathlib
          pathlib.Path('release/huiji-p/BUILD-INFO.json').write_text(json.dumps({'version': pathlib.Path('VERSION').read_text().strip(), 'commit': os.environ['GITHUB_SHA'], 'run': os.environ['GITHUB_RUN_ID'], 'target':'linux-amd64', 'origin':'GitHub Actions'}, indent=2)+'\n')
          PYINFO
          tar --exclude=__pycache__ --exclude='*.pyc' -czf "release/huiji-p-$version-linux-amd64.tar.gz" -C release huiji-p
          cd release
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: |
            release/*.tar.gz
            release/SHA256SUMS
          retention-days: 30
      - name: Publish verified candidate and attachments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(cat VERSION)
          cp docs/RELEASE-NOTES.md release/notes.md
          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> release/notes.md
          gh release create "$version" "release/huiji-p-$version-linux-amd64.tar.gz" release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MeetingScribe $version — Realtime meeting transcription" --notes-file release/notes.md --prerelease
